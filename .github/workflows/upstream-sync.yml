name: Upstream sync
# Weekly merge from marcusgreen/moodle-qtype_aitext (the upstream of this
# hard fork). On a clean merge, tools/rename-from-upstream.sh re-applies
# the component rename to whatever the merge brought in and a PR is
# opened; on conflict, an issue is opened instead.
#
# Note: PRs created with the default GITHUB_TOKEN do not trigger the
# Moodle plugin CI workflow. Close and reopen the PR (or push any commit
# to its branch) to get a CI run before merging.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/marcusgreen/moodle-qtype_aitext.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge, rename and open PR or issue
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="upstream-sync/$(date +%Y%m%d)"
          git switch -c "$branch"
          if git merge --no-edit upstream/main; then
            sh tools/rename-from-upstream.sh
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git add -A
              git commit -m "chore: re-apply component rename after upstream merge"
            fi
            git push origin "$branch"
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Merge upstream qtype_aitext ($(date +%Y-%m-%d))" \
              --body "Automated weekly merge of marcusgreen/moodle-qtype_aitext, with the component rename re-applied by tools/rename-from-upstream.sh. Review the diff, then close and reopen this PR to trigger CI."
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            gh issue create \
              --title "Upstream sync conflict ($(date +%Y-%m-%d))" \
              --body "$(printf 'The weekly merge of marcusgreen/moodle-qtype_aitext hit conflicts in:\n\n```\n%s\n```\n\nMerge manually: git fetch upstream && git merge upstream/main, resolve, then run tools/rename-from-upstream.sh.\n' "$conflicts")"
          fi
